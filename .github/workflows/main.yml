name: Continuous Security Log Scan Loop

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [ main ]

jobs:
  security-audit-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Security Repository Code Base
      uses: actions/checkout@v4

    - name: Initialize Enterprise R Runtime Environment
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true 

    # Optimized: Automatically cache dependencies to speed up subsequent runs
    - name: Setup R Dependencies Cache
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          tidyverse
          jsonlite

    - name: Execute Live 3-Sigma Anomaly Mapping Engine
      run: Rscript log_anomaly_detectorV2.R
