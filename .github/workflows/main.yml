name: Continuous Security Log Scan Loop

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [ main ]

jobs:
  security-audit-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Security Repository Code Base
      uses: actions/checkout@v4

    - name: Initialize Enterprise R Runtime Environment
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true 

    - name: Setup R Dependencies Cache
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          tidyverse
          tsibble
          fable
          distributional

    - name: Execute Live Adaptive ML Anomaly Mapping Engine
      run: Rscript log_anomaly_detector.R

# Fixes the un-evaluated webhook string leak bug
    - name: Parse Analytics Metadata and Broadcast Discord Alert
      if: success()
      env:
        # Corrected: Removed the backslash escape character to pass the parameter successfully
        WEBHOOK_URL: \${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        if [ -f threat_summary.env ]; then
          source threat_summary.env
          if [ "\$ALERT_STATUS" = "CRITICAL" ]; then
            echo "[!] Security threat breach isolated. Dispensing payload vector to Discord..."
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{
                       "username": "SIEM Core Security Engine",
                       "avatar_url": "https://githubassets.com",
                       "embeds": [{
                         "title": "🚨 CRITICAL ARCHITECTURE EXTRUSION THREAT ISOLATED",
                         "description": "Adaptive time-series threshold modeling arrays have broken statistical containment lines.",
                         "color": 15158332,
                         "fields": [
                           { "name": "Target Node Vector ID", "value": "'"\$TARGET_NODE"'", "inline": true },
                           { "name": "Peak Spike Connection Volume", "value": "'"\$METRIC_PEAK"' req/15min", "inline": true },
                           { "name": "Mitigation Strategy", "value": "Mitigation script `blocklist_manifest.sh` generated successfully.", "inline": false }
                         ],
                         "footer": { "text": "Continuous Security Monitoring Engine Run Instance" }
                       }]
                     }' \$WEBHOOK_URL
          else
            echo "[-] Telemetry baseline normal. Skipping security alert channel broadcast."
          fi
        fi

    - name: Upload Security Anomaly Report Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: network-threat-report-latest
        path: |
          isolated_threats_report.csv
          network_threat_analysis.png
          blocklist_manifest.sh
        retention-days: 14
