name: Continuous Security Log Scan Loop

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [ main ]

jobs:
  security-audit-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Security Repository Code Base
      uses: actions/checkout@v4

    - name: Initialize Enterprise R Runtime Environment
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true 

    - name: Setup R Dependencies Cache
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          tidyverse
          jsonlite

    - name: Execute Live 3-Sigma Anomaly Mapping Engine
      run: Rscript log_anomaly_detector.R

    # NEW: Securely packages and saves your extracted threats
    - name: Upload Security Anomaly Report Artifact
      if: always() # Ensures logs are saved even if an unexpected processing error occurs
      uses: actions/upload-artifact@v4
      with:
        name: network-threat-report-${{ github.run_id }}
        path: isolated_threats_report.csv
        retention-days: 14 # Stores the files for 2 weeks before automated cleanup
